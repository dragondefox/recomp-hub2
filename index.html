<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recomp Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#07070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  color-scheme:dark;
  --bg:#07070b;
  --card:rgba(20,20,28,0.72);
  --card-solid:#14141c;
  --card2:rgba(30,30,42,0.75);
  --line:rgba(255,255,255,0.08);
  --line-hi:rgba(255,255,255,0.16);
  --text:#f4f4fa;
  --muted:#8e8ea0;
  --acc:#00f584;
  --acc2:#00c8ff;
  --blue:#29b6f6;
  --org:#ffa726;
  --pur:#b388ff;
  --red:#ff5252;
  --onacc:#001a0d;
  --spring:cubic-bezier(0.35,1.56,0.64,1);
  --ease:cubic-bezier(0.22,1,0.36,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body.oled{
  --bg:#000000;
  --card:rgba(8,8,11,0.92);
  --card-solid:#08080b;
  --card2:rgba(16,16,22,0.95);
  --line:rgba(255,255,255,0.07);
  --line-hi:rgba(0,245,132,0.22);
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --bg:#eef0f6;
    --card:rgba(255,255,255,0.82);
    --card-solid:#ffffff;
    --card2:rgba(236,238,246,0.85);
    --line:rgba(0,0,0,0.07);
    --line-hi:rgba(255,255,255,0.9);
    --text:#12121a;
    --muted:#646476;
    --acc:#00a858;
    --acc2:#0288d1;
    --blue:#0277bd;
    --org:#ef6c00;
    --pur:#6a3fd0;
    --red:#d32f2f;
    --onacc:#ffffff;
  }
}
html{height:100%;scroll-behavior:smooth}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,sans-serif;
  padding-bottom:112px;
  font-size:15px;
  overflow-x:hidden;
  position:relative;
}
/* Ambient Aurora Background */
body::before,body::after{
  content:'';
  position:fixed;
  width:380px;height:380px;
  border-radius:50%;
  filter:blur(90px);
  opacity:.18;
  pointer-events:none;
  z-index:-1;
}
body::before{background:radial-gradient(circle,var(--acc),transparent 70%);top:-140px;left:-90px}
body::after{background:radial-gradient(circle,var(--pur),var(--blue),transparent 70%);bottom:80px;right:-120px;animation-delay:-8s}
body.oled::before,body.oled::after{opacity:.07}
@keyframes aurora{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(40px,25px) scale(1.12)}
  100%{transform:translate(-25px,45px) scale(0.94)}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}.ptcl{display:none}}
/* Keyframes */
@keyframes cardIn{
  from{opacity:0;transform:translateY(14px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes popCheck{
  0%{transform:scale(.8)}
  50%{transform:scale(1.18)}
  100%{transform:scale(1)}
}
@keyframes shimmer{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(220%)}
}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 8px 30px rgba(41,182,246,0.35),0 0 0 0 rgba(41,182,246,0.4)}
  50%{box-shadow:0 8px 36px rgba(41,182,246,0.55),0 0 0 8px rgba(41,182,246,0)}
}
@keyframes modalPop{
  from{opacity:0;transform:scale(.9) translateY(16px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}

/* Header */
header{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:25;
  background:color-mix(in srgb,var(--card-solid) 72%,transparent);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  box-shadow:0 4px 24px rgba(0,0,0,0.22);
}
h1{
  font-size:1.18rem;
  font-weight:900;
  letter-spacing:-.6px;
  background:linear-gradient(135deg,var(--text) 35%,var(--acc) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
h1 small{
  background:linear-gradient(135deg,rgba(41,182,246,0.2),rgba(179,136,255,0.2));
  border:1px solid rgba(41,182,246,0.35);
  color:var(--blue);
  -webkit-text-fill-color:var(--blue);
  font-size:.62rem;
  padding:2px 7px;
  border-radius:99px;
  letter-spacing:.4px;
  font-weight:800;
}
.sub{font-size:.72rem;color:var(--muted);margin-top:3px;font-weight:500}
.dnav{display:flex;align-items:center;gap:5px;margin-top:6px}
.dnav button{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:4px 10px;
  font-size:.72rem;
  font-weight:700;
  color:var(--text);
  transition:transform .18s var(--spring),border-color .2s,background .2s;
}
.dnav button:active{transform:scale(.9)}
.dnav button:disabled{opacity:.3;pointer-events:none}
.dnav .today-pill{
  background:color-mix(in srgb,var(--blue) 20%,transparent);
  color:var(--blue);
  border-color:color-mix(in srgb,var(--blue) 45%,transparent);
  box-shadow:0 0 12px rgba(41,182,246,0.22);
}

/* Main & Cards */
.main{max-width:620px;margin:0 auto;padding:14px 12px}
.tab{display:none}.tab.on{display:block}
.card{
  background:color-mix(in srgb,var(--card-solid) 94%,transparent);
  border:1px solid var(--line);
  border-top-color:var(--line-hi);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.06);
  animation:cardIn .38s var(--ease) both;
}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}
.card:nth-child(5){animation-delay:.16s}

.ct{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.95rem;margin-bottom:12px;gap:8px;letter-spacing:-.2px}
.badge{
  font-size:.68rem;
  padding:4px 10px;
  border-radius:99px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc2) 14%,transparent));
  border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);
  color:var(--acc);
  font-weight:800;
  letter-spacing:.2px;
  box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 15%,transparent);
}

/* Progress Bars with Shimmer */
.bar{
  height:10px;
  background:var(--card2);
  border-radius:99px;
  overflow:hidden;
  margin-top:7px;
  position:relative;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.4);
}
.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  border-radius:99px;
  transition:width .55s var(--spring);
  position:relative;
  overflow:hidden;
  box-shadow:0 0 12px color-mix(in srgb,var(--acc) 55%,transparent);
}
.bar i::after{
  content:'';
  position:absolute;top:0;left:0;bottom:0;width:45%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
  animation:shimmer 2.6s infinite;
}
.bar.b i{background:linear-gradient(90deg,#0288d1,var(--blue));box-shadow:0 0 12px rgba(41,182,246,0.45)}
.bar.o i{background:linear-gradient(90deg,#f57c00,var(--org));box-shadow:0 0 12px rgba(255,167,38,0.45)}
.bar.p i{background:linear-gradient(90deg,#7c4dff,var(--pur));box-shadow:0 0 12px rgba(179,136,255,0.45)}
.bar.over i{background:linear-gradient(90deg,var(--red),#ff8a80);box-shadow:0 0 12px rgba(255,82,82,0.5)}

.row{display:flex;justify-content:space-between;align-items:center;font-size:.81rem}
.row b{font-size:.94rem;font-weight:800;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.box{
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px 12px;
  transition:transform .2s var(--ease),border-color .2s;
}

/* Interactive Buttons & Tiles */
button{font:inherit;color:inherit;cursor:pointer;user-select:none}
.btn{
  background:var(--card2);
  border:1px solid var(--line);
  border-top-color:var(--line-hi);
  border-radius:13px;
  padding:11px 13px;
  font-size:.8rem;
  font-weight:700;
  transition:transform .18s var(--spring),box-shadow .2s,border-color .2s,background .2s;
}
.btn:active{transform:scale(.93)}
.btn.p{
  background:linear-gradient(135deg,var(--acc),#00c864);
  color:var(--onacc);
  border-color:transparent;
  font-weight:800;
  box-shadow:0 4px 16px color-mix(in srgb,var(--acc) 35%,transparent);
}
.btn.pu{
  background:linear-gradient(135deg,var(--pur),#7c4dff);
  color:#fff;
  border-color:transparent;
  font-weight:800;
  box-shadow:0 4px 16px rgba(179,136,255,0.35);
}

.tile{
  background:var(--card2);
  border:1px solid var(--line);
  border-top-color:var(--line-hi);
  border-radius:15px;
  padding:11px 12px;
  text-align:left;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:5px;
  min-height:70px;
  position:relative;
  overflow:hidden;
  transition:transform .2s var(--spring),border-color .2s,box-shadow .2s;
}
.tile:hover{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.tile:active{
  transform:scale(.94);
  border-color:var(--acc);
  box-shadow:0 0 18px color-mix(in srgb,var(--acc) 28%,transparent);
}
.tile.cu{
  border-color:color-mix(in srgb,var(--pur) 45%,transparent);
  background:linear-gradient(145deg,color-mix(in srgb,var(--pur) 10%,var(--card2)),var(--card2));
}
.tile b{font-size:.79rem;line-height:1.25;font-weight:700}
.tile span{font-size:.69rem;color:var(--acc);font-weight:700;font-variant-numeric:tabular-nums}
.tile.cu span{color:var(--pur)}
.x{position:absolute;top:5px;right:6px;color:var(--muted);font-size:.82rem;background:none;border:0;padding:3px 5px;border-radius:6px}
.x:active{background:rgba(255,82,82,0.2);color:var(--red)}

/* Inputs */
input{
  font:inherit;
  background:var(--card2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:12px;
  padding:10px 12px;
  width:100%;
  min-width:0;
  outline:none;
  font-variant-numeric:tabular-nums;
  transition:border-color .2s,box-shadow .2s,transform .15s;
}
input:focus{
  border-color:var(--acc);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent);
}
.ir{display:flex;gap:8px;margin-top:8px}.ir>*{flex:1}.ir .n{flex:0 0 74px}

/* Checklists */
.chk{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px 13px;
  background:var(--card2);
  border:1px solid var(--line);
  border-radius:15px;
  margin-bottom:8px;
  cursor:pointer;
  transition:transform .2s var(--spring),border-color .25s,background .25s,box-shadow .25s;
}
.chk:active{transform:scale(.97)}
.chk.done{
  border-color:color-mix(in srgb,var(--acc) 65%,transparent);
  background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--card2)),var(--card2));
  box-shadow:0 4px 18px -4px color-mix(in srgb,var(--acc) 25%,transparent);
}
.cb{
  width:25px;height:25px;
  border-radius:8px;
  border:2px solid var(--muted);
  display:grid;place-items:center;
  color:transparent;
  font-size:.82rem;
  font-weight:900;
  flex:none;
  transition:all .25s var(--spring);
}
.chk.done .cb{
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  border-color:transparent;
  color:var(--onacc);
  animation:popCheck .35s var(--spring);
  box-shadow:0 0 12px color-mix(in srgb,var(--acc) 55%,transparent);
}
.chk b{font-size:.85rem;display:block;font-weight:700}
.chk small{font-size:.71rem;color:var(--muted)}

/* Pills */
.pills{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{
  white-space:nowrap;
  padding:9px 16px;
  border-radius:99px;
  background:var(--card2);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:.76rem;
  font-weight:800;
  transition:all .22s var(--spring);
}
.pill:active{transform:scale(.92)}
.pill.on{
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:var(--onacc);
  border-color:transparent;
  box-shadow:0 4px 15px color-mix(in srgb,var(--acc) 35%,transparent);
}

.sh{font-size:.73rem;font-weight:800;color:var(--muted);margin:14px 0 7px;text-transform:uppercase;letter-spacing:.6px}
.log{
  display:flex;justify-content:space-between;gap:8px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:.79rem;align-items:center;
  animation:cardIn .25s var(--ease);
}
.log:last-child{border:0}
.log em{font-style:normal;color:var(--acc);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.log .x{position:static}

/* Exercise Cards */
.ex{
  background:linear-gradient(145deg,var(--card2),color-mix(in srgb,var(--card2) 70%,transparent));
  border:1px solid var(--line);
  border-left:3.5px solid var(--blue);
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  transition:transform .2s var(--ease),border-color .25s,box-shadow .25s;
}
.ex.ex-done{
  border-left-color:var(--acc);
  box-shadow:0 4px 20px -6px color-mix(in srgb,var(--acc) 25%,transparent);
}
.ex b{
  font-size:.88rem;
  cursor:pointer;
  color:var(--text);
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:color .18s;
}
.ex b::after{content:'📈';font-size:.72rem;opacity:.75}
.ex b:active{color:var(--acc)}
.ex .t{
  font-size:.69rem;
  color:var(--blue);
  background:rgba(41,182,246,0.12);
  border:1px solid rgba(41,182,246,0.25);
  padding:2px 8px;
  border-radius:99px;
  font-weight:800;
  white-space:nowrap;
}
.ex .h{font-size:.71rem;color:var(--muted);margin:5px 0 7px;line-height:1.35}
.ex .d{
  font-size:.71rem;
  color:var(--org);
  background:rgba(255,167,38,0.1);
  border:1px solid rgba(255,167,38,0.25);
  padding:5px 9px;
  border-radius:9px;
  margin-bottom:8px;
  font-weight:600;
}
.ex .du-note{
  font-size:.71rem;
  color:var(--blue);
  font-weight:700;
  margin-bottom:7px;
}

.sr{
  display:grid;
  grid-template-columns:30px 1fr 1fr 46px;
  gap:7px;
  align-items:center;
  margin-bottom:6px;
  padding:3px;
  border-radius:12px;
  transition:background .25s;
}
.sr.row-done{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.sr span{font-size:.72rem;color:var(--muted);font-weight:800;text-align:center}
.sr input{text-align:center;padding:9px 4px;font-weight:700}
.sr .sb{
  flex:none;min-width:0;width:100%;height:40px;
  border-radius:11px;
  border:1px solid var(--line);
  background:var(--card-solid);
  font-weight:900;font-size:.82rem;
  transition:all .22s var(--spring);
}
.sr .sb:active{transform:scale(.86)}
.sr .sb.on{
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:var(--onacc);
  border-color:transparent;
  animation:popCheck .35s var(--spring);
  box-shadow:0 0 14px color-mix(in srgb,var(--acc) 50%,transparent);
}
.hd{margin-bottom:2px;padding:0 3px}.hd em{font-style:normal;font-size:.64rem;color:var(--muted);text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.4px}

.mod{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.74rem;color:var(--muted)}
.mod button{
  width:32px;height:32px;border-radius:10px;
  border:1px solid var(--line);background:var(--card-solid);
  font-weight:800;transition:transform .15s var(--spring);
}
.mod button:active{transform:scale(.88)}
.mod b{color:var(--text);min-width:18px;text-align:center;font-size:.9rem;cursor:default}
.mod b::after{content:none}
.mod .rm{margin-left:auto;width:auto;padding:0 11px;color:var(--red);font-size:.72rem}

/* Hero Calorie Ring */
.hero{display:flex;align-items:center;gap:18px}
.ring{width:128px;flex:none;filter:drop-shadow(0 4px 14px rgba(0,245,132,0.18))}
.ring circle{transition:stroke-dashoffset .75s var(--spring),stroke .3s}
.hs{flex:1;min-width:0}

/* Calendar Grid Styles */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head b{font-size:1rem;font-weight:800;text-transform:capitalize}
.cal-head button{
  background:var(--card2);border:1px solid var(--line);border-radius:10px;
  width:36px;height:34px;font-weight:800;transition:transform .18s var(--spring);
}
.cal-head button:active{transform:scale(.88)}
.cal-wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.68rem;color:var(--muted);font-weight:800;margin-bottom:6px;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{
  aspect-ratio:1;
  border-radius:13px;
  background:transparent;
  border:1.5px solid var(--line);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:.82rem;
  font-weight:700;
  color:var(--muted);
  position:relative;
  transition:all .22s var(--spring);
  padding:2px;
}
.cal-day:active{transform:scale(.88)}
.cal-day.empty-slot{border:0;pointer-events:none}
.cal-day.future{opacity:.3;pointer-events:none}
/* Tracked day has glowing colored border */
.cal-day.tracked{
  color:var(--text);
  background:color-mix(in srgb,var(--acc) 10%,var(--card2));
  border:2px solid var(--acc);
  box-shadow:0 0 12px color-mix(in srgb,var(--acc) 28%,transparent),inset 0 0 6px color-mix(in srgb,var(--acc) 14%,transparent);
}
.cal-day.tracked.partial{
  border-color:var(--blue);
  background:color-mix(in srgb,var(--blue) 10%,var(--card2));
  box-shadow:0 0 10px rgba(41,182,246,0.25);
}
.cal-day.sel{
  transform:scale(1.06);
  outline:2px solid var(--acc2);
  outline-offset:1px;
  color:var(--text);
  font-weight:900;
}
.cal-day.is-today span::after{
  content:'';
  display:block;
  width:4px;height:4px;
  border-radius:50%;
  background:var(--org);
  margin:1px auto 0;
}
.cal-dots{display:flex;gap:2px;margin-top:2px;height:4px}
.cal-dots i{width:4px;height:4px;border-radius:50%;display:block}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:.7rem;color:var(--muted);justify-content:center}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend b{width:10px;height:10px;border-radius:4px;display:inline-block}

/* Floating Island Bottom Nav */
nav{
  position:fixed;
  bottom:calc(10px + env(safe-area-inset-bottom,0px));
  left:10px;right:10px;
  max-width:600px;
  margin:0 auto;
  background:color-mix(in srgb,var(--card-solid) 82%,transparent);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--line-hi);
  border-radius:24px;
  display:flex;
  padding:5px;
  z-index:30;
  box-shadow:0 12px 34px rgba(0,0,0,0.55);
}
nav button{
  flex:1;
  background:none;
  border:0;
  padding:6px 0;
  color:var(--muted);
  font-size:.62rem;
  font-weight:700;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;

function weekChart(){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d}),w=300,h=82;
 const vals=days.map(d=>tot(D(dk(d))).k),mx=Math.max(S.g.kcal,...vals);

 </svg>`}
const planEx=k=>[...(W[k]?W[k][1]:[]),...(S.cx[k]||[])].filter(e=>!S.hid[e[0]]);
const plans=()=>[...Object.keys(W),...Object.keys(S.cpl)];

const repTop=tg=>{const m=String(tg).match(/×\s*(\d+)(?:-(\d+))?/);return m?+(m[2]||m[1]):0};
const lastSess=id=>(S.hist[id]||[]).filter(x=>x.d<dk()).at(-1);
function histSave(id){const ss=(D().s[id]||[]).filter(x=>x&&x.x),h=(S.hist[id]||[]).filter(x=>x.d!==dk());if(ss.length)h.push({d:dk(),s:ss.map(x=>({k:x.k,r:x.r}))});h.sort((a,b)=>a.d.localeCompare(b.d));S.hist[id]=h.slice(-20)}
function progHint(id,tg){const L=lastSess(id),top=repTop(tg);if(!L||!top)return '';const ks=L.s.map(x=>parseFloat(String(x.k).replace(',','.')));if(!L.s.every((x,i)=>+x.r>=top&&ks[i]>0))return '';return `💡 Ostatnio ${top} powt. we wszystkich seriach — spróbuj ${+(Math.max(...ks)+2.5).toFixed(1)} kg`}
const exName=id=>{for(const p of [...Object.values(W).map(x=>x[1]),...Object.values(S.cx)])for(const e of p)if(e[0]===id)return e[1];return id};
function meCard(){const ks=Object.keys(S.me).sort(),l=S.me[ks.at(-1)]||{},f=S.me[ks[0]]||{};return `<div class="card"><div class="ct"><span>Obwody ciała (cm)</span><span class="badge">${ks.length} pomiarów</span></div><div class="ir" style="margin:0">${MK.map(k=>`<input id="me-${k}" type="number" step="0.1" placeholder="${k}${l[k]?' '+l[k]:''}" inputmode="decimal">`).join('')}</div><button class="btn" id="mes" style="width:100%;margin-top:8px">Zapisz pomiar</button>${ks.length>1?`<div class="sub" style="margin-top:8px">${MK.filter(k=>l[k]&&f[k]).map(k=>`${k}: ${l[k]} (${(l[k]-f[k]>0?'+':'')+(l[k]-f[k]).toFixed(1)})`).join(' · ')}</div>`:''}</div>`}
const defSets=tg=>{const m=String(tg).match(/(\d)\D*rozgrz\.\s*\+\s*(\d)/);return m?+m[1]+ +m[2]:(parseInt(tg)||3)};
const nSets=(id,tg)=>S.nc[id]??defSets(tg);
function ring(v,m){const r=42,c=2*Math.PI*r,o=c*(1-Math.min(1,v/m));return `<svg class="ring" viewBox="0 0 100 100">
 <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--acc)"/><stop offset="100%" stop-color="var(--acc2)"/></linearGradient></defs>
 <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--card2)" stroke-width="9"/>
 <circle cx="50" cy="50" r="${r}" fill="none" stroke="${v>m?'var(--red)':'url(#rg)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 50 50)"/>
 <text x="50" y="52" text-anchor="middle" style="fill:var(--text);font-size:21px;font-weight:900">${v}</text>
 <text x="50" y="66" text-anchor="middle" style="font-size:8px;letter-spacing:.6px">KCAL</text>
</svg>`}
const dual=w=>{const v=parseFloat(String(w).replace(',','.'));return v>0?`⚖︎ Łącznie ${v} kg = po ${+(v/2).toFixed(2)} kg na rękę`:'⚖︎ Wpisz łączny ciężar obu hantli'};
let calcMode = 'bar';
const calcPlates=(kg, mode=calcMode)=>{
  const base = mode==='bar' ? 20 : 2.5;
  if(kg<=base) return mode==='bar' ? 'Sama sztanga (20 kg)' : 'Sam gryf hantli (2.5 kg)';
  let rem=(kg-base)/2;
  if(rem<0) return 'Zbyt mały ciężar';
  const ps=[20,15,10,5,2.5,1.25,1,0.5];let res=[];
  for(let p of ps){let cnt=Math.floor(rem/p);if(cnt>0){res.push(`${cnt}×${p}kg`);rem=+(rem-cnt*p).toFixed(2)}}
  return res.length?`Na jedną stronę: ${res.join(', ')}`:'Brak dodatkowych talerzy';
};
function plateSvg(kg,mode=calcMode){
  const base=mode==='bar'?20:2.5;if(!(kg>base))return '';
  let rem=(kg-base)/2;
  const spec=[[20,44,11,'#ef5350'],[15,40,10,'#fdd835'],[10,35,9,'#26a69a'],[5,29,8,'#42a5f5'],[2.5,24,7,'#ab47bc'],[1.25,20,6,'#9e9e9e'],[1,18,5,'#78909c'],[0.5,16,5,'#b0bec5']];
  let x=52,rects='';
  for(const [w,h,th,col] of spec){
    let cnt=Math.floor(rem/w);
    while(cnt-->0 && x<240){
      rects+=`<rect x="${x}" y="${30-h/2}" width="${th}" height="${h}" rx="2.5" fill="${col}" stroke="#0006"/><text x="${x+th/2}" y="33" text-anchor="middle" style="fill:#000;font-size:6px;font-weight:900">${w}</text>`;
      x+=th+2;rem=+(rem-w).toFixed(2);
    }
  }
  return `<div class="plate-vis"><svg viewBox="0 0 260 60" width="100%" style="max-width:280px"><rect x="10" y="27" width="240" height="6" rx="3" fill="#6e7180"/><rect x="44" y="21" width="6" height="18" rx="2" fill="#9ea2b4"/>${rects}</svg></div>`;
}

function renderCalendar(){
  const [y,m]=calMonth.split('-').map(Number);
  const mName=new Date(y,m-1,1).toLocaleDateString('pl-PL',{month:'long',year:'numeric'});
  const firstDay=(new Date(y,m-1,1).getDay()+6)%7; // Poniedziałek = 0
  const daysInMonth=new Date(y,m,0).getDate();
  const tk=todayKey();
  let cells='',trackedCount=0;
  for(let i=0;i<firstDay;i++)cells+=`<div class="cal-day empty-slot"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const k=`${calMonth}-${String(day).padStart(2,'0')}`;
    const st=dayStatus(k);
    if(st.tracked)trackedCount++;
    const isFut=k>tk;
    const cls=[
      'cal-day',
      st.tracked?(st.full?'tracked':'tracked partial'):'',
      k===curDate?'sel':'',
      k===tk?'is-today':'',
      isFut?'future':''
    ].filter(Boolean).join(' ');
    const dots=st.tracked?`<div class="cal-dots">${st.hasFood?'<i style="background:var(--acc)"></i>':''}${st.hasWork?'<i style="background:var(--blue)"></i>':''}${st.hasSleep?'<i style="background:var(--pur)"></i>':''}${st.hasAct?'<i style="background:var(--org)"></i>':''}</div>`:'';
    cells+=`<button class="${cls}" data-cday="${k}"><span>${day}</span>${dots}</button>`;
  }

  // Podgląd wybranego dnia (curDate)
  const sd=D(curDate),st=tot(sd),sw=S.wh[curDate];
  const histEx=[];
  for(const [id,arr] of Object.entries(S.hist||{})){
    const found=arr.find(x=>x.d===curDate);
    if(found)histEx.push([exName(id),found.s.map(s=>`${s.k}×${s.r}`).join(', ')]);
  }
  // Również serie wpisane bezpośrednio w sd.s (jeśli jeszcze nie w hist lub bez x)
  if(!histEx.length && sd.s){
    for(const [id,arr] of Object.entries(sd.s)){
      const valid=(arr||[]).filter(x=>x&&(x.x||x.r));
      if(valid.length)histEx.push([exName(id),valid.map(s=>`${s.k}×${s.r}`).join(', ')]);
    }
  }
  const acts=[];
  if(sd.c?.wf)acts.push('🏀 Zajęcia WF');
  if(sd.c?.foot)acts.push('⚽ Piłka nożna');
  if(sd.c?.pool)acts.push('🏊‍♂️ Basen');
  if(sd.c?.run)acts.push('🏃 Bieganie');
  (S.sups||[]).forEach(sp=>{if(sd.c?.[sp.id])acts.push('💊 '+sp.n)});

  const selTitle=new Date(curDate+'T12:00:00').toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const dst=dayStatus(curDate);

  return `
  <div class="card">
    <div class="ct"><span>📅 Kalendarz pomiarów</span><span class="badge">${trackedCount} dni w mies.</span></div>
    <div class="cal-head">
      <button data-cm="-1" title="Poprzedni miesiąc">◀</button>
      <b>${mName}</b>
      <button data-cm="1" title="Następny miesiąc">▶</button>
    </div>
    <div class="cal-wk"><span>Pn</span><span>Wt</span><span>Śr</span><span>Cz</span><span>Pt</span><span>So</span><span>Nd</span></div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span><b style="border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 20%,transparent)"></b>Pełny (jedzenie + trening lub sen)</span>
      <span><b style="border:2px solid var(--blue);background:color-mix(in srgb,var(--blue) 20%,transparent)"></b>Częściowy</span>
      <span><b style="border:1.5px solid var(--line)"></b>Pusty</span>
    </div>
  </div>
  <div class="card">
    <div class="ct"><span>📋 Podgląd: ${selTitle}</span><span class="badge">${dst.tracked?'Zapisany':'Brak danych'}</span></div>
    <div class="grid2" style="margin-bottom:10px">
      <div class="box"><div class="row"><span>Kalorie</span><b>${st.k} / ${S.g.kcal}</b></div>${bar(st.k,S.g.kcal)}</div>
      <div class="box"><div class="row"><span>Białko</span><b>${st.p} / ${S.g.p} g</b></div>${bar(st.p,S.g.p,'b')}</div>
      <div class="box"><div class="row"><span>Woda & Kroki</span><b>${sd.w.toFixed(2)}L · ${sd.st}</b></div>${bar(sd.st,S.g.steps,'o')}</div>
      <div class="box"><div class="row"><span>Sen ${sd.nap?`(+${sd.napM||0}m)`:''}</span><b>${sd.sl||0} h</b></div>${bar(sd.sl||0,8,'p')}</div>
    </div>
    ${sw?`<div class="log"><span>⚖️ Zapisana waga ciała</span><em>${sw.toFixed(1)} kg</em></div>`:''}
    ${acts.length?`<div class="log"><span>🏅 Aktywności i stack</span><em>${acts.join(' · ')}</em></div>`:''}
    ${histEx.length?`<div class="sh">🏋️ Trening tego dnia:</div>${histEx.map(([n,s])=>`<div class="log"><span>${esc(n)}</span><em>${esc(s)}</em></div>`).join('')}`:''}
    ${sd.f.length?`<div class="sh">🍽️ Spożyte posiłki (${sd.f.length}):</div>${sd.f.map(x=>`<div class="log"><span><b style="color:var(--muted)">${x.t}</b> ${esc(x.n)}</span><em>${x.k} kcal · ${x.p}g B</em></div>`).join('')}`:''}
    ${!dst.tracked?`<div class="empty">Ten dzień nie ma jeszcze żadnych zapisanych pomiarów. Kliknij poniżej, aby uzupełnić dane dla tej daty.</div>`:''}
    <div class="ir" style="margin-top:12px">
      <button class="btn p" data-goto="home">⚡ Edytuj w Pulpicie</button>
      <button class="btn" data-goto="diet">🍽️ Dodaj posiłek</button>
      <button class="btn" data-goto="act">😴 Sen / Ruch</button>
    </div>
  </div>`;
}

 <label>Lub skopiuj / wklej tekst JSON ręcznie</label><textarea id="bk">${esc(JSON.stringify(S))}</textarea>
 <div class="ir"><button class="btn p" id="gs">Zapisz cele</button><button class="btn" id="gi">Przywróć z pola</button></div>
 <button class="btn" id="gr" style="width:100%;margin-top:8px;color:var(--red)">Usuń wszystkie dane</button>`;
 dl.showModal();
 $('#dx').onclick=()=>dl.close();
 $('#oled-toggle').onclick=()=>{S.g.oled=!S.g.oled;document.body.classList.toggle('oled',S.g.oled);$('#oled-toggle').classList.toggle('done',S.g.oled);save()};
 $('#gs').onclick=()=>{dl.querySelectorAll('[data-g]').forEach(i=>{const v=parseFloat(i.value);if(v>0)S.g[i.dataset.g]=v});dl.close();save()};
 $('#gi').onclick=()=>{try{S={...def(),...JSON.parse($('#bk').value)};dl.close();save()}catch(x){alert('Niepoprawny JSON')}};
 $('#gf_dl').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`recomp-backup-${todayKey()}.json`;a.click();URL.revokeObjectURL(a.href)};
 $('#gf_ul').onclick=()=>$('#gf_in').click();
 $('#gf_in').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S={...def(),...JSON.parse(r.result)};dl.close();save()}catch(x){alert('Niepoprawny plik JSON')}};r.readAsText(f)};
 $('#gr').onclick=()=>{if(confirm('Usunąć wszystkie dane? Tego nie da się cofnąć.')){S=def();dl.close();save()}}}
function openAddEx(){const dl=$('#dlg');let du=0;
 dl.innerHTML=`<div class="ct"><span>Nowe ćwiczenie · ${S.wk}</span><button class="x" style="position:static;font-size:1.1rem" id="dx">✕</button></div><label>Nazwa</label><input id="xn" placeholder="np. Face pull"><div class="ir"><div><label>Ciężar (kg)</label><input id="xw" placeholder="BW" inputmode="decimal"></div><div><label>Serie</label><input id="xs" type="number" value="3" inputmode="numeric"></div><div><label>Powt.</label><input id="xr" placeholder="8-12"></div></div><div class="chk" id="xd" style="margin-top:12px"><div class="cb">✓</div><div><b>Ćwiczenie z 2 hantlami</b><small>Pokaż przelicznik na jedną rękę</small></div></div><button class="btn p" id="xa" style="width:100%;margin-top:4px">Dodaj do planu</button>`;
 dl.showModal();$('#dx').onclick=()=>dl.close();
 $('#xd').onclick=e=>{du^=1;e.currentTarget.classList.toggle('done',!!du)};
 $('#xa').onclick=()=>{const n=$('#xn').value.trim();if(!n)return;const s=Math.min(10,Math.max(1,parseInt($('#xs').value)||3)),id='x'+Date.now().toString(36);
  (S.cx[S.wk]=S.cx[S.wk]||[]).push([id,n,`${s}×${$('#xr').value.trim()||'—'}`,'',du,$('#xw').value.trim()||'BW',1]);S.nc[id]=s;dl.close();save()}}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
