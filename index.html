 else if(ds.ct!==undefined){S.tiles.splice(ds.ct,1);save()}
 else if(c.id==='ws'){const v=parseFloat($('#wi').value.replace(',','.'));if(v>40&&v<250){S.wh[dk()]=v;save()}}
 else if(c.id==='ca'||c.id==='cg'){const n=$('#cn').value.trim(),k=parseInt($('#ck').value)||0,p=parseInt($('#cp').value)||0;if(!n||(!k&&!p))return;S.tiles.push({n,k,p,c:parseFloat($('#cc').value)||0,f:parseFloat($('#cf').value)||0,u:c.id==='cg'?100:0});S.cat='cu';save()}
 else if(c.id==='ra'){const km=parseFloat($('#rk').value.replace(',','.'));if(!(km>0))return;S.runs.unshift({date:new Date(curDate+'T12:00:00').toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'}),km,min:parseInt($('#rm').value)||0,ts:new Date(curDate+'T12:00:00').getTime()});d.c.run=true;save()}
 else if(c.id==='sts'){const v=parseInt($('#sti').value);if(v>=0){d.st=v;save()}}
 else if(ds.ns){const[id,dl]=ds.ns.split('|'),e=planEx(S.wk).find(x=>x[0]===id);S.nc[id]=Math.min(10,Math.max(1,nSets(id,e?e[2]:'3')+ +dl));save()}
 else if(ds.hide){if(!confirm('Usunąć ćwiczenie z planu?'))return;const cx=S.cx[S.wk]||[],i=cx.findIndex(x=>x[0]===ds.hide);i>=0?cx.splice(i,1):S.hid[ds.hide]=1;save()}
 else if(ds.unhide){S.hid={};save()}
 else if(ds.addex)openAddEx();
 else if(ds.addpl){const n=(prompt('Nazwa planu (np. FBW)')||'').trim();if(n&&!W[n]){S.cpl[n]=1;S.wk=n;save()}}
 else if(ds.delpl){if(confirm('Usunąć plan?')){delete S.cpl[S.wk];delete S.cx[S.wk];S.wk='PULL';save()}}
 else if(c.id==='mes'){const o={};MK.forEach(k=>{const v=parseFloat($('#me-'+k).value.replace(',','.'));if(v>0)o[k]=v});if(Object.keys(o).length){S.me[dk()]={...S.me[dk()],...o};save()}}
 else if(c.id==='setBtn')openSettings();
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='fs')renderFoods();
 if(t.dataset.sk){const[id,i]=t.dataset.sk.split('|'),[k,r]=t.parentElement.querySelectorAll('input'),d=D();d.s[id]=d.s[id]||[];d.s[id][i]={...d.s[id][i],k:k.value,r:r.value};
  if(t.dataset.du==='1'){const duEl=$('#du-'+id);if(duEl)duEl.textContent=dual(k.value)}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}}
 if(t.id==='calc-input'){const val=parseFloat(t.value)||0;const resEl=$('#calc-res');if(resEl)resEl.textContent=calcPlates(val)}});
function openExerciseChart(id){const name=exName(id),h=S.hist[id]||[];const dl=$('#dlg');
 let chartHtml='<div class="empty">Brak historii sesji dla tego ćwiczenia. Zapisuj serie z ciężarem!</div>';
 if(h.length>=1){const vals=h.map(x=>Math.max(...x.s.map(s=>parseFloat(String(s.k).replace(',','.'))||0)));const mn=Math.min(...vals)-5,mx=Math.max(...vals)+5,w=280,h80=80;
  const X=i=>10+i*(w-20)/(Math.max(1,vals.length-1)),Y=y=>h80-10-(y-mn)/(mx-mn||1)*(h80-20),pts=vals.map((y,i)=>X(i)+','+Y(y)).join(' ');
  chartHtml=`<svg viewBox="0 0 ${w} ${h80+15}" width="100%"><polyline fill="none" stroke="var(--blue)" stroke-width="2.5" points="${pts}"/><circle cx="${X(vals.length-1)}" cy="${Y(vals.at(-1))}" r="3.5" fill="var(--acc)"/></svg><div class="sub">Ostatnie sesje: ${h.map(x=>x.d.slice(5)+': '+x.s.map(s=>s.k+'kg').join(', ')).join(' | ')}</div>`}
 dl.innerHTML=`<div class="ct"><span>📈 ${esc(name)}</span><button class="x" style="position:static;font-size:1.1rem" id="dx">✕</button></div>
 ${chartHtml}
 <div class="sh" style="margin-top:14px">⚖️ Kalkulator sprzętu:</div>
 <div class="pills" style="margin-bottom:6px">
   <button class="pill ${calcMode==='bar'?'on':''}" id="mode-bar">Sztanga (20 kg)</button>
   <button class="pill ${calcMode==='db'?'on':''}" id="mode-db">Hantla (2.5 kg)</button>
 </div>
 <input id="calc-input" type="number" placeholder="Wpisz ciężar całkowity (np. 70)" inputmode="decimal">
 <div class="plate-calc" id="calc-res">Wpisz ciężar, aby zobaczyć rozkład talerzy.</div>`;
 dl.showModal();$('#dx').onclick=()=>dl.close();
 $('#mode-bar').onclick=()=>{calcMode='bar';$('#mode-bar').classList.add('on');$('#mode-db').classList.remove('on');const val=parseFloat($('#calc-input').value)||0;$('#calc-res').textContent=calcPlates(val)};
 $('#mode-db').onclick=()=>{calcMode='db';$('#mode-db').classList.add('on');$('#mode-bar').classList.remove('on');const val=parseFloat($('#calc-input').value)||0;$('#calc-res').textContent=calcPlates(val)}}
function openSettings(){const g=S.g,dl=$('#dlg');
 dl.innerHTML=`<div class="ct"><span>Cele i dane</span><button class="x" style="position:static;font-size:1.1rem" id="dx">✕</button></div>
 ${[['kcal','Kalorie (kcal)'],['p','Białko (g)'],['water','Woda (L)'],['steps','Kroki'],['start','Waga startowa (kg)'],['target','Waga docelowa (kg)']].map(([k,l])=>`<label>${l}</label><input data-g="${k}" type="number" step="any" value="${g[k]}">`).join('')}
 <div class="chk ${g.oled?'done':''}" id="oled-toggle" style="margin-top:12px"><div class="cb">✓</div><div><b>Czysty czarny motyw OLED (#000)</b><small>Włącz głęboką czerń w tle</small></div></div>
 <label>Kopia zapasowa do pliku (.json)</label>
 <div class="ir" style="margin-top:4px"><button class="btn" id="gf_dl">📥 Pobierz .json</button><button class="btn" id="gf_ul">📤 Wczytaj .json</button><input type="file" id="gf_in" accept=".json,application/json" style="display:none"></div>
 <label>Lub skopiuj / wklej tekst JSON ręcznie</label><textarea id="bk">${esc(JSON.stringify(S))}</textarea>
 <div class="ir"><button class="btn p" id="gs">Zapisz cele</button><button class="btn" id="gi">Przywróć z pola</button></div>
 <button class="btn" id="gr" style="width:100%;margin-top:8px;color:var(--red)">Usuń wszystkie dane</button>`;
 dl.showModal();
 $('#dx').onclick=()=>dl.close();
 $('#oled-toggle').onclick=()=>{S.g.oled=!S.g.oled;document.body.classList.toggle('oled',S.g.oled);$('#oled-toggle').classList.toggle('done',S.g.oled);save()};
 $('#gs').onclick=()=>{dl.querySelectorAll('[data-g]').forEach(i=>{const v=parseFloat(i.value);if(v>0)S.g[i.dataset.g]=v});dl.close();save()};
 $('#gi').onclick=()=>{try{S={...def(),...JSON.parse($('#bk').value)};dl.close();save()}catch(x){alert('Niepoprawny JSON')}};
 $('#gf_dl').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`recomp-backup-${todayKey()}.json`;a.click();URL.revokeObjectURL(a.href)};
 $('#gf_ul').onclick=()=>$('#gf_in').click();
 $('#gf_in').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S={...def(),...JSON.parse(r.result)};dl.close();save()}catch(x){alert('Niepoprawny plik JSON')}};r.readAsText(f)};
 $('#gr').onclick=()=>{if(confirm('Usunąć wszystkie dane? Tego nie da się cofnąć.')){S=def();dl.close();save()}}}
function openAddEx(){const dl=$('#dlg');let du=0;
 dl.innerHTML=`<div class="ct"><span>Nowe ćwiczenie · ${S.wk}</span><button class="x" style="position:static;font-size:1.1rem" id="dx">✕</button></div><label>Nazwa</label><input id="xn" placeholder="np. Face pull"><div class="ir"><div><label>Ciężar (kg)</label><input id="xw" placeholder="BW" inputmode="decimal"></div><div><label>Serie</label><input id="xs" type="number" value="3" inputmode="numeric"></div><div><label>Powt.</label><input id="xr" placeholder="8-12"></div></div><div class="chk" id="xd" style="margin-top:12px"><div class="cb">✓</div><div><b>Ćwiczenie z 2 hantlami</b><small>Pokaż przelicznik na jedną rękę</small></div></div><button class="btn p" id="xa" style="width:100%;margin-top:4px">Dodaj do planu</button>`;
 dl.showModal();$('#dx').onclick=()=>dl.close();
 $('#xd').onclick=e=>{du^=1;e.currentTarget.classList.toggle('done',!!du)};
 $('#xa').onclick=()=>{const n=$('#xn').value.trim();if(!n)return;const s=Math.min(10,Math.max(1,parseInt($('#xs').value)||3)),id='x'+Date.now().toString(36);
  (S.cx[S.wk]=S.cx[S.wk]||[]).push([id,n,`${s}×${$('#xr').value.trim()||'—'}`,'',du,$('#xw').value.trim()||'BW',1]);S.nc[id]=s;dl.close();save()}}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
